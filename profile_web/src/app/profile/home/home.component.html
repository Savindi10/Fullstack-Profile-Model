<!--Create tag for name-->
<div class="profile-container" style="width :1200px; margin-left:30px ; margin-top:20px; " >
    <h1 style="color:blueviolet; font-weight: bold;">Full Stack Application with Angular 18, Python(Django) & MySQL</h1>
    
    <mat-form-field style="width:220px; height:63px;margin-top: 20px;">
        <input matInput type="text" name="name" id="name" placeholder="Enter Your Name" [(ngModel)]="profile.name">
        <mat-icon fontIcon="person" matSuffix></mat-icon>
     </mat-form-field>

     <!--Create the email-->
     
     <mat-form-field style="width:220px; height:63px;margin-top: 20px; margin-left: 15px; ">
        <input matInput type="text" name="email" id="email" placeholder="Enter Your E-mail" [(ngModel)]="profile.email">
        <mat-icon fontIcon="email" matSuffix></mat-icon>
     </mat-form-field>

     <!--Create the address-->

     <mat-form-field style="width:230px; height:63px;margin-top: 20px; margin-left: 15px;">
        <input matInput type="text" name="address" id="address" placeholder="Enter Your Address" [(ngModel)]="profile.address">
        <mat-icon fontIcon="home" matSuffix></mat-icon>
     </mat-form-field>



<!--add search button-->
<mat-form-field style="width:220px; height:63px;margin-top: 20px; margin-left: 15px; ">
    <input matInput type="text" #searchInput (keyup)="searchProfile(searchInput.value)" placeholder="Enter Profile">
    <mat-icon fontIcon="search" matSuffix></mat-icon>
 </mat-form-field>


     <!--Create the add and cancel button-->
     <button mat-flat-button 
        style="background-color: rgb(0, 106, 255); 
               margin-left: 45px; 
               padding: 10px 24px; 
               font-size: 16px; 
               color: white;"
        (click)="addUpdateProfile(profile)">
        Add 
     </button>

    <button mat-flat-button 
        style="background-color: red; 
               margin-left: 20px; 
               padding: 10px 24px; 
               font-size: 16px; 
               color: white;">
        Cancel
    </button>

<br>
<!-- Add the Angular material table from here-->
<table mat-table [dataSource]="dataSource" class="mat-elevation-z8 " matSort>

    <!--- Note that these columns can be defined in any order.
          The actual rendered columns are set as a property on the row definition" -->
  
    <!-- Position Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Profile ID </th>
      <td mat-cell *matCellDef="let row"> {{row.id}} </td>
    </ng-container>
  
    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
      <td mat-cell *matCellDef="let row"> {{row.name}} </td>
    </ng-container>
  
    <!-- Weight Column -->
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
      <td mat-cell *matCellDef="let row"> {{row.email}} </td>
    </ng-container>
  
    <!-- Symbol Column -->
    <ng-container matColumnDef="address">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Address </th>
      <td mat-cell *matCellDef="let row"> {{row.address}} </td>
    </ng-container>
  
        <!-- Symbol Column -->
        <ng-container matColumnDef="edit">
          <th mat-header-cell *matHeaderCellDef> Edit </th>
          <td mat-cell *matCellDef="let row"> <button mat-flat-button style="height:25px; width:auto; background-color: rgb(0, 0, 255);" (click)="setProfile(row)">Edit</button> </td>
        </ng-container>

        <!-- Symbol Column -->
        <ng-container matColumnDef="delete">
          <th mat-header-cell *matHeaderCellDef> Delete </th>
          <td mat-cell *matCellDef="let row"> <button mat-flat-button style="height:25px; width:auto; background-color: rgb(255, 0, 34);" (click)="deleteProfile(row.id)">Delete</button> </td>
        </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <br>
  <!--for pegination-->
  <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                 showFirstLastButtons
                 aria-label="Select page of periodic elements">
  </mat-paginator>
  
  
</div>
